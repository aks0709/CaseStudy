<div class="cart-page">
  <div class="page-header">
    <h2>Your Cart</h2>
  </div>

  <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div *ngIf="loading" class="loading">Loading cart...</div>

  <ng-container *ngIf="!loading">
    <div *ngIf="cart.items.length === 0" class="empty-cart">
      <p>Your cart is empty.</p>
      <a routerLink="/catalog" class="btn-browse">Browse Products</a>
    </div>

    <div *ngIf="cart.items.length > 0">
      <div class="cart-item" *ngFor="let item of cart.items">
        <div class="item-info">
          <h4>{{ item.productName }}</h4>
          <span class="unit-price">${{ item.unitPrice | number:'1.2-2' }} each</span>
        </div>

        <div class="item-controls">
          <button (click)="updateQuantity(item.id, item.quantity - 1)" [disabled]="item.quantity <= 1">−</button>
          <span class="qty">{{ item.quantity }}</span>
          <button (click)="updateQuantity(item.id, item.quantity + 1)">+</button>
        </div>

        <div class="item-total">${{ item.lineTotal | number:'1.2-2' }}</div>

        <button class="btn-remove" (click)="removeItem(item.id)">Remove</button>
      </div>

      <div class="cart-summary">
        <div class="grand-total">
          <span>Grand Total</span>
          <strong>${{ cart.grandTotal | number:'1.2-2' }}</strong>
        </div>
        <button class="btn-checkout" (click)="checkout()" [disabled]="checkingOut">
          {{ checkingOut ? 'Processing...' : 'Proceed to Checkout' }}
        </button>
      </div>
    </div>
  </ng-container>
</div>
