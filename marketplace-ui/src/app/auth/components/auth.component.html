<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-header">
      <h1 class="brand">Marketplace</h1>
      <p class="subtitle">{{ isLoginMode ? 'Welcome back!' : 'Create your account' }}</p>
    </div>

    <!-- Toggle tabs -->
    <div class="tab-toggle">
      <button [class.active]="isLoginMode" (click)="isLoginMode = true; errorMessage = ''">Login</button>
      <button [class.active]="!isLoginMode" (click)="isLoginMode = false; errorMessage = ''">Register</button>
    </div>

    <!-- Error message -->
    <div class="error-banner" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form *ngIf="isLoginMode" [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
        <span class="field-error">{{ getError(loginForm, 'email') }}</span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
        <span class="field-error">{{ getError(loginForm, 'password') }}</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <!-- Register Form -->
    <form *ngIf="!isLoginMode" [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="fullName" placeholder="Jane Doe" />
        <span class="field-error">{{ getError(registerForm, 'fullName') }}</span>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
        <span class="field-error">{{ getError(registerForm, 'email') }}</span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
        <span class="field-error">{{ getError(registerForm, 'password') }}</span>
      </div>

      <div class="form-group">
        <label>I am a...</label>
        <div class="role-toggle">
          <button type="button"
            [class.selected]="registerForm.get('role')?.value === 'Customer'"
            (click)="registerForm.get('role')?.setValue('Customer')">
            Customer
          </button>
          <button type="button"
            [class.selected]="registerForm.get('role')?.value === 'Merchant'"
            (click)="registerForm.get('role')?.setValue('Merchant')">
            Merchant
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

  </div>
</div>
