services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multiclientdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 945725
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./MultiClientPlatform.Api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=multiclientdb;Username=postgres;Password=945725"
      Jwt__Key: "your-very-strong-secret-key-at-least-32-chars!!"
      Jwt__Issuer: "MultiClientPlatform"
      Jwt__Audience: "MultiClientPlatformUsers"
      Jwt__ExpiryMinutes: "60"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./marketplace-ui
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
